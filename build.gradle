// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        maven {
            url "http://211.91.57.96:8081/artifactory/mg-app-libs-release/"
            allowInsecureProtocol true
        }
        google()
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        jcenter(){url 'https://jcenter.bintray.com/'}
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'
//        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.2'
//        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.5'
        classpath 'org.jfrog.buildinfo:build-info-extractor-gradle:5.2.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            url "http://211.91.57.96:8081/artifactory/mg-app-libs-release/"
            allowInsecureProtocol true
        }
        google()
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        jcenter(){url 'https://jcenter.bintray.com/'}
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    compileSdkVersion = 33
    minSdkVersion = 21
    targetSdkVersion = 33

    supportLibraryVersion = "25.1.1"
    supportLibraryVersionInHost = "28.0.0"

    glideVersion = "4.7.1"

    skinAndroidSupportVersion = "3.2.8"
    skinAndroidSupportSkinGroup = "skin.support"


    skinAndroidXVersion = "6.0.3.3"
    skinAndroidXSkinGroup = "android.skin"

    artifactory_user='justin'
    artifactory_password='123456'
//    artifactory_contextUrl='http://192.168.50.6:8081/artifactory/'
    artifactory_contextUrl='http://211.91.57.96:8081/artifactory/'
}
