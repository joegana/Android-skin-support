plugins {
    id 'com.android.library'
}

android {
    namespace 'skin.support.percentlayout'
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

task generateSourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    classifier 'sources'
}

afterEvaluate {
    tasks.matching {
        (it.name.endsWith('artifactoryPublish'))
    }.each { tk ->
        tk.dependsOn('assembleRelease', 'generateSourcesJar')
    }
}


dependencies {
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation project(':androidx:skin-support')
    implementation project(':androidx:skin-support-appcompat')
}

ext {
    publishVersion = rootProject.skinAndroidXVersion
    publishGroup = rootProject.skinAndroidXSkinGroup
    moduleName = 'skin-support-percentlayout'
    descContent = 'percentlayout 控件换肤支持包'
}

//apply from: '../../publishing_maven.gradle'
apply from: '../../publishing_localmaven.gradle'