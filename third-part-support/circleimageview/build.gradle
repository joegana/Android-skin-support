apply plugin: 'com.android.library'

ext {
    publishVersion = rootProject.skinAndroidXVersion
    publishGroup = rootProject.skinAndroidXSkinGroup
    moduleName = 'circleimageview'
    artifactFilePath  = "${project.buildDir}/outputs/aar/${project.name}-" +
            "${(publishGroup.endsWith('SNAPSHOT') || publishGroup.endsWith('snapshot'))?'debug':'release'}.aar"
    descContent = 'CircleImageView 控件换肤支持包'
}

android {
    compileSdkVersion rootProject.compileSdkVersion
    namespace "skin.support.circleimageview"
    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures{
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation project(':androidx:skin-support')
    implementation project(':androidx:skin-support-appcompat')
}

ext {
    publishVersion = '2.1.0.4'
    publishGroup = rootProject.skinAndroidXSkinGroup
    moduleName = 'circleimageview'
    descContent = 'hdodenhof/CircleImageView 控件换肤支持包'
}

task generateSourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    var src =  'sources'
    archiveClassifier.convention(src)
    archiveClassifier.set(src)
}

afterEvaluate {
    logger.quiet("当前version:{}",publishVersion)
    def snapShortVer = publishVersion.endsWith('SNAPSHOT') || publishVersion.endsWith('snapshot')
    tasks.matching {
        (it.name.endsWith('artifactoryPublish') || it.name.endsWith('publishAarPublicationToMavenLocal'))
    }.each { tk ->
        tk.dependsOn("assemble${snapShortVer?'Debug':'Release'}", "generateSourcesJar")
    }
}


